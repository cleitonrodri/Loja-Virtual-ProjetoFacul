<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 " />
    <title>TechStore - SIGN IN</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="tela-centralizada">
      <div class="box-autenticacao">
        <h1 class="logo-loja-auth">Tech<span>Store</span></h1>

        <form id="formSignin" class="formulario-auth">
          <h2>Acesse sua conta</h2>

          <div class="grupo-input">
            <label for="emailSignin">E-mail</label>
            <input
              type="email"
              id="emailSignin"
              placeholder="Digite seu e-mail"
              required
            />
          </div>

          <div class="grupo-input">
            <label for="senhaSignin">Senha</label>
            <input
              type="password"
              id="senhaSignin"
              placeholder="Digite sua senha"
              required
            />
          </div>

          <button type="submit" class="btn-principal">Entrar</button>

          <p class="texto-rodape">
            Não tem conta? <a href="signup.html">Cadastre-se aqui</a>
          </p>
        </form>
      </div>
    </main>

    <script src="js/signin.js"></script>
  </body>
</html>
