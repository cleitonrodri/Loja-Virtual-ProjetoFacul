<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore - Painel do Admin</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/admin.css" />
  </head>
  <body>
    <header class="cabecalho-principal">
      <h1 class="logo-loja">Painel Administrativo</h1>
      <nav class="menu-navegacao">
        <a href="index.html" class="link-menu">⬅ Voltar para a Loja</a>
      </nav>
    </header>

    <main class="container-principal">
      <div class="menu-abas">
        <button onclick="abrirAba('abaPedidos')">📦 Ver Pedidos</button>
        <button onclick="abrirAba('abaUsuarios')">👥 Ver Usuários</button>
        <button onclick="abrirAba('abaEstoque')">📋 Ver Estoque</button>
        <button onclick="abrirAba('abaNovoProduto')">
          ➕ Cadastrar Produto
        </button>
      </div>

      <hr />

      <div class="dashboard-cards">
        <div class="card-resumo card-vendas">
          <h3>💰 Faturamento</h3>
          <p id="cardTotalVendas">R$ 0.00</p>
        </div>
        <div class="card-resumo card-clientes">
          <h3>👥 Clientes</h3>
          <p id="cardTotalUsuarios">0</p>
        </div>
        <div class="card-resumo card-produtos">
          <h3>📦 Produtos</h3>
          <p id="cardTotalProdutos">0</p>
        </div>
      </div>

      <div id="abaPedidos" class="conteudo-aba">
        <h2>Pedidos Finalizados</h2>
        <table class="tabela-admin">
          <thead>
            <tr>
              <th>Nº Pedido</th>
              <th>Cliente</th>
              <th>Data da Compra</th>
              <th>Total (R$)</th>
            </tr>
          </thead>
          <tbody id="tabelaPedidos"></tbody>
        </table>
      </div>

      <div id="abaUsuarios" class="conteudo-aba" style="display: none">
        <h2>Usuários do Sistema</h2>
        <table class="tabela-admin">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>E-mail</th>
            </tr>
          </thead>
          <tbody id="tabelaUsuarios"></tbody>
        </table>
      </div>

      <div id="abaEstoque" class="conteudo-aba" style="display: none">
        <h2>Produtos no Estoque</h2>
        <table class="tabela-admin">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Preço (R$)</th>
              <th>Qtd</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaEstoque"></tbody>
        </table>
      </div>

      <div id="abaNovoProduto" class="conteudo-aba" style="display: none">
        <h2 id="tituloFormProduto">Adicionar Novo Produto</h2>

        <div class="formulario-admin">
          <input
            type="text"
            id="nomeProduto"
            placeholder="Nome (Ex: Mouse Gamer)"
          />
          <input
            type="number"
            id="precoProduto"
            placeholder="Preço (Ex: 150.00)"
          />
          <input type="text" id="descProduto" placeholder="Descrição rápida" />

          <label for="imagemProduto" style="margin-top: 10px;">Link da Foto do Produto:</label>
          <input type="url" id="imagemProduto" placeholder="Cole a URL da imagem (Ex: https://...)" required />

          <label for="categoriaProduto">Categoria do Produto:</label>
          <select
            id="categoriaProduto"
            onchange="verificarNovaCategoria()"
            required
          >
            <option value="" disabled selected>
              Selecione uma categoria...
            </option>
            <option value="teclado">Teclados</option>
            <option value="mouse">Mouses</option>
            <option value="monitor">Monitores</option>
            <option value="placa-mae">Placas-Mãe</option>
            <option value="placa-video">Placas de Vídeo</option>
            <option value="nova_categoria">➕ Criar Nova Categoria...</option>
          </select>

          <input
            type="text"
            id="inputNovaCategoria"
            placeholder="Digite o nome da nova categoria"
            style="display: none"
          />
          <input
            type="text"
            id="marcaProduto"
            placeholder="Marca (Ex: Logitech, Redragon)"
          />
          <input
            type="number"
            id="estoqueProduto"
            placeholder="Quantidade no Estoque"
          />
          <input type="hidden" id="idProdutoEditando" value="" />

          <button
            id="btnSalvarProduto"
            class="btn-form btn-salvar"
            onclick="cadastrarProduto()"
          >
            Salvar no Banco de Dados
          </button>
        </div>
      </div>
    </main>

    <script src="./js/admin.js"></script>
  </body>
</html>
