<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGN - UP</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="tela-centralizada">
      <div class="box-autenticacao">
        <h1 class="logo-loja-auth">Loja de Periféricos</h1>

        <form id="formSignup" class="formulario-auth">
          <h2>Criar minha conta</h2>
          <p
            style="
              color: #666;
              font-size: 14px;
              margin-top: -10px;
              margin-bottom: 10px;
            "
          >
            Informe os seus dados abaixo para criar sua conta
          </p>

          <div class="grupo-input">
            <label for="nomeSignup">Nome Completo</label>
            <input
              type="text"
              id="nomeSignup"
              placeholder="Seu Nome Completo"
              required
            />
          </div>

          <div class="grupo-input">
            <label for="emailSignup">E-mail</label>
            <input
              type="email"
              id="emailSignup"
              placeholder="Seu E-mail"
              required
            />
          </div>

          <div class="grupo-input">
            <label for="senhaSignup">Senha</label>
            <input
              type="password"
              id="senhaSignup"
              placeholder="Crie uma Senha"
              required
              minlength="6"
            />
          </div>

          <button type="submit" class="btn-principal">Criar Conta</button>

          <p class="texto-rodape">
            Já tem conta? <a href="signin.html">Faça o Login</a>
          </p>
        </form>
      </div>
    </main>

    <script src="js/signup.js"></script>
  </body>
</html>
